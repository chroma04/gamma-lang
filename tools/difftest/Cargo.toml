[package]
name = "difftest"
version = "0.0.0"
publish = false
edition = "2024"
description = "Differential tester: random Gamma programs run by the interpreter and by the C back end with gcc and clang"

# Not part of the main workspace (like `fuzz/`): `cargo build` and `cargo test` at the
# root never compile it.
[workspace]
members = ["."]

[dependencies]

[profile.release]
debug = 0
