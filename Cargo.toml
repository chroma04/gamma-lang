[package]
name = "gamma"
version = "0.1.0"
edition = "2024"
# The oldest toolchain that builds the crate (`if let` guards); CI checks it.
rust-version = "1.95"
description = "Compiler, interpreter and tools for the Gamma programming language"
license = "MIT"
repository = "https://github.com/chroma04/gamma-lang"
readme = "README.md"
keywords = ["compiler", "interpreter", "programming-language", "gamma"]
categories = ["compilers", "development-tools"]

[dependencies]
cranelift-codegen = { version = "0.135", default-features = false, features = ["std", "x86", "arm64"] }
cranelift-frontend = "0.135"
cranelift-module = "0.135"
cranelift-object = "0.135"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
libc = "0.2.190"
libffi = "5.2.0"
num-bigint = "0.4"
num-integer = "0.1.47"
num-rational = { version = "0.4.2", features = ["num-bigint"] }
num-traits = "0.2.19"
semver = "1.0.28"
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
toml_edit = "0.25.17"

[profile.dev]
# The compile-time evaluator and the test suite run noticeably faster with
# light optimization; debug info is kept.
opt-level = 1

[features]
# Counts the bytecode instructions the interpreter runs (see docs/contributing.md).
vm-profile = []
