[package]
name = "gamma"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.190"
libffi = "5.2.0"
num-bigint = "0.4"
num-integer = "0.1.47"
num-rational = { version = "0.4.2", features = ["num-bigint"] }
num-traits = "0.2.19"
semver = "1.0.28"
serde_json = "1.0.154"
sha2 = "0.11.1"
toml_edit = "0.25.17"

[profile.dev]
# The compile-time evaluator and the test suite run noticeably faster with
# light optimization; debug info is kept.
opt-level = 1

[features]
# Counts the bytecode instructions the interpreter runs (see docs/contributing.md).
vm-profile = []
