[package]
name = "gamma-playground"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Gamma interpreter built for WebAssembly, for the web playground"
license = "MIT"

# Kept out of the main crate's build: built only for wasm32-wasip1 (see README.md).
[workspace]

[dependencies]
gamma = { path = "../.." }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
