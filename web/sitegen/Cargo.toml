[package]
name = "gamma-sitegen"
version = "0.1.0"
edition = "2024"
description = "Static site generator for the Gamma website"
license = "MIT"
publish = false

# Not part of the root crate's workspace: the site generator is built on its own.
[workspace]

[dependencies]
# The lexer, used to highlight Gamma code.
gamma = { path = "../.." }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde_json = "1.0.154"
