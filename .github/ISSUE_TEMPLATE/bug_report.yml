name: Bug report
description: The compiler, interpreter, a tool or the standard library does something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A small program that shows the problem helps most.
        For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: program
    attributes:
      label: Program
      description: The smallest Gamma program (or command) that shows the problem.
      render: gamma
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: How you ran it.
      placeholder: gamma run --backend=c --mode=checked main.gm
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output, diagnostics or crash report, copied as text.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: If the spec says what should happen, name the section (for example §9.3).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `gamma --version`, or the commit you built.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, architecture, and the C compiler for the C back end (`cc --version`).
      placeholder: Ubuntu 24.04 x86_64, gcc 13.2
  - type: dropdown
    id: backend
    attributes:
      label: Back end
      description: Does the problem appear with the interpreter, the C back end, or both?
      options:
        - Not sure / not applicable
        - Interpreter only
        - C back end only
        - Both
