name: Website

# Builds the website (web/) with the playground's WebAssembly interpreter on every pull
# request, and publishes it to GitHub Pages from main. Both are built by gamma, from the
# seed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install clang's WebAssembly support, the WASI C library and Binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 wasi-libc libclang-rt-18-dev-wasm32 binaryen
      - name: Build gamma from the seed
        run: bootstrap/build.sh
      - name: Test and build the site generator
        env:
          GAMMA_STD: ${{ github.workspace }}/lib/std
          GAMMA_RUNTIME: ${{ github.workspace }}/runtime
        run: |
          target/bootstrap/gamma test web/gen
          mkdir -p target/web
          target/bootstrap/gamma build --mode=fast web/gen -o target/web/sitegen
      - name: Build the playground interpreter (wasm32-wasi)
        env:
          CC: clang-18 --target=wasm32-wasi
          GAMMA: ${{ github.workspace }}/target/bootstrap/gamma
        run: web/play/build.sh target/web/play
      - name: Check the playground examples
        run: node web/check.mjs target/web/play/gamma-play.wasm target/web/play/gamma-play-libs.json
      - name: Generate the site
        run: |
          target/web/sitegen --out _site
          cp target/web/play/gamma-play.wasm target/web/play/gamma-play-libs.json _site/assets/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
