name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Conformance tests and examples with Debug builds split into C units
        if: matrix.os == 'ubuntu-latest'
        env:
          GAMMA_C_UNITS: "3"
        run: cargo test --test conformance --test examples

  msrv:
    # The oldest Rust that Cargo.toml's `rust-version` promises still builds the crate.
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets

  windows:
    # x86_64 Windows: the compiler is built with the MSVC toolchain; the C back end uses
    # MinGW-w64 gcc (MSVC's cl.exe is not supported), here from MSYS2.
    name: Build and test (Windows, MinGW-w64 gcc)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install MinGW-w64 gcc
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Put gcc on PATH
        shell: pwsh
        run: |
          "${{ steps.msys.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Check the C compiler
        shell: pwsh
        run: |
          gcc --version
          gcc -dumpmachine
      - name: Clippy
        run: cargo clippy --all-targets
      # No `CC` here: cc-rs would pass it to the MSVC build of libffi. Gamma itself takes
      # the first of cc, gcc and clang on PATH, which is MSYS2's (added first above).
      - name: Test
        run: cargo test --all-targets --no-fail-fast

  safe:
    # Safe builds compile the generated C with Fil-C, a memory-safe C implementation.
    name: Safe builds (Fil-C)
    runs-on: ubuntu-latest
    env:
      FILC_VERSION: "0.686"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the Fil-C download
        id: filc-cache
        uses: actions/cache@v4
        with:
          path: ~/filc
          key: optfil-${{ env.FILC_VERSION }}-linux-x86_64
      - name: Download Fil-C
        if: steps.filc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/filc
          curl -fsSL -o ~/filc/optfil.tar.xz \
            "https://github.com/pizlonator/fil-c/releases/download/v${FILC_VERSION}/optfil-${FILC_VERSION}-linux-x86_64.tar.xz"
      - name: Install Fil-C in /opt/fil
        run: |
          mkdir -p "$RUNNER_TEMP/filc"
          tar -C "$RUNNER_TEMP/filc" -xJf ~/filc/optfil.tar.xz
          cd "$RUNNER_TEMP/filc/optfil-${FILC_VERSION}-linux-x86_64"
          sudo ./setup.sh -u
          /opt/fil/bin/filcc --version
      - name: Test Safe builds
        run: GAMMA_TEST_SAFE=1 cargo test --test conformance --test native_build

  s390x:
    # s390x is 64-bit big-endian: the suite runs cross-compiled under qemu-user.
    name: Big-endian cross build (s390x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the cross toolchain and the emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu qemu-user
      - name: Conformance and runtime tests for s390x
        env:
          CC: s390x-linux-gnu-gcc
          CFLAGS: -static
          # Build scripts (libffi-sys) compile C for the host: keep them off the cross compiler.
          CC_x86_64_unknown_linux_gnu: gcc
          CFLAGS_x86_64_unknown_linux_gnu: ""
          GAMMA_RUNNER: qemu-s390x -L /usr/s390x-linux-gnu
        run: cargo test --release --test conformance --test runtime --test cross

  aarch64:
    # The native back ends on AArch64 Linux, under an emulator. The macOS runners cover
    # Apple's variant of the AArch64 calling convention; this job covers the standard one.
    name: AArch64 Linux, emulated (C and Cranelift back ends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the cross toolchain and the emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - name: Conformance and Cranelift tests for aarch64
        env:
          CC: aarch64-linux-gnu-gcc
          CFLAGS: -static
          CC_x86_64_unknown_linux_gnu: gcc
          CFLAGS_x86_64_unknown_linux_gnu: ""
          GAMMA_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
        run: cargo test --release --test conformance --test cranelift

  difftest:
    # Differential testing (tools/difftest): random well-typed programs must behave the same
    # on the interpreter and on the C back end compiled by gcc and by clang. The first batch
    # of seeds is fixed, so a failure there reproduces anywhere; the second moves with the run
    # number, so successive runs cover new programs. A failing seed is printed with the three
    # outputs and can be inspected with `difftest --print SEED`.
    name: Differential tests (gcc, clang)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build gamma and difftest
        run: |
          cargo build --release
          cargo build --release --manifest-path tools/difftest/Cargo.toml --target-dir target
      - name: Compilers
        run: |
          gcc --version | head -n 1
          clang --version | head -n 1
      - name: Fixed seeds
        run: target/release/difftest --start 0 --count 100 --cc gcc,clang
      - name: Rotating seeds
        run: |
          start=$((1000 + (GITHUB_RUN_NUMBER % 500) * 200))
          echo "seeds $start..$((start + 200))"
          target/release/difftest --start "$start" --count 200 --cc gcc,clang

  benchmarks:
    # Runs `gamma bench bench/` with the compiler of the pull request and with the base
    # branch's, and prints the ratios in the job summary. Informational: timing never fails it.
    name: Benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build this branch
        run: cargo build --release
      - name: Build the base branch
        continue-on-error: true
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          cd ../base && CARGO_TARGET_DIR="$PWD/../base-target" cargo build --release
      - name: Compare
        run: |
          base=""
          if [ -x ../base-target/release/gamma ]; then base=../base-target/release/gamma; fi
          ./scripts/bench-compare.sh target/release/gamma "$base" bench

  editors:
    # The TextMate grammar's scope tests, and the tree-sitter grammar: its generated
    # parser must be up to date, its corpus tests must pass, and it must parse every file
    # of the standard library and every conformance test the compiler accepts.
    name: Editor grammars
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: TextMate grammar
        working-directory: editors/vscode
        run: npm ci && npm test
      - name: Tree-sitter grammar
        working-directory: editors/tree-sitter-gamma
        run: |
          npm ci
          npx tree-sitter generate
          git diff --exit-code -- src
          npm test
      - name: Tree-sitter grammar on the repository's Gamma code
        run: |
          cargo build
          cd editors/tree-sitter-gamma && STRICT=1 ./scripts/parse-corpus.sh
      - name: Emacs mode
        # Ubuntu's Emacs links tree-sitter 0.20, which loads parsers of ABI 14 only, so
        # the tests use a copy of the grammar generated for it.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q emacs-nox
          tmp=$(mktemp -d)
          cp -r editors/tree-sitter-gamma "$tmp/gamma"
          (cd "$tmp/gamma" && npx tree-sitter generate --abi 14 && mkdir -p "$tmp/lib" \
            && cc -fPIC -shared -O2 -I src src/parser.c src/scanner.c -o "$tmp/lib/libtree-sitter-gamma.so")
          export GAMMA_TS_GRAMMAR_DIR="$tmp/lib"
          emacs --batch -L editors/emacs -l ert -l editors/emacs/test/gamma-ts-mode-tests.el \
            -f ert-run-tests-batch-and-exit
          emacs --batch -L editors/emacs --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile editors/emacs/gamma-ts-mode.el editors/emacs/test/gamma-ts-mode-tests.el
          rm -f editors/emacs/*.elc editors/emacs/test/*.elc
      - name: Zed extension queries
        run: editors/zed/check-queries.sh
      - name: Zed extension (WebAssembly)
        working-directory: editors/zed
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-wasip2 -- -D warnings
          cargo build --release --target wasm32-wasip2
