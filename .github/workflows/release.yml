name: Release

# Pushing a tag `vX.Y.Z` builds `gamma` for Linux and macOS (x86_64 and arm64) and Windows
# (x86_64), checks that each one runs a program on the interpreter and through C from its
# installed layout, and publishes them as a GitHub release whose notes are the version's
# section of CHANGELOG.md. The compiler is built without anything but a C compiler: on
# Linux and macOS from the bootstrap seed, for Windows by cross-compiling with MinGW-w64 on
# Linux. Release binaries are built in Fast mode. Running the workflow by hand builds and
# checks the archives without publishing them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the job that publishes the release writes to the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so that the binaries run on older glibc versions.
          - os: ubuntu-22.04
            asset: linux-x86_64
          - os: ubuntu-22.04-arm
            asset: linux-aarch64
          - os: macos-15-intel
            asset: macos-x86_64
          - os: macos-14
            asset: macos-aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the compiler's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(awk '/^\[/ { pkg = ($0 == "[package]") } pkg && /^version = / { gsub(/"/, "", $3); print $3; exit }' compiler/gamma.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME does not match the version $version in compiler/gamma.toml" >&2
            exit 1
          fi
      - name: Check that CHANGELOG.md has a section for the version
        run: |
          version=$(awk '/^\[/ { pkg = ($0 == "[package]") } pkg && /^version = / { gsub(/"/, "", $3); print $3; exit }' compiler/gamma.toml)
          if ! grep -q "^## $version\b" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Build gamma from the seed
        run: bootstrap/build.sh
      - name: Build the release binary (Fast mode)
        env:
          GAMMA_STD: ${{ github.workspace }}/lib/std
          GAMMA_RUNTIME: ${{ github.workspace }}/runtime
        run: target/bootstrap/gamma build --mode=fast compiler -o target/release-gamma
      - name: Package
        run: tools/package-release.sh "${{ matrix.asset }}" target/release-gamma dist
      - name: Smoke test the installed layout
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -C "$RUNNER_TEMP/smoke" -xzf "dist/gamma-${{ matrix.asset }}.tar.gz"
          # Hide the source tree's libraries and runtime, so that only the packaged ones
          # can be found.
          mv lib lib.hidden
          mv runtime runtime.hidden
          tools/smoke-release.sh "$(echo "$RUNNER_TEMP"/smoke/gamma-*/bin/gamma)"
      - uses: actions/upload-artifact@v7
        with:
          name: gamma-${{ matrix.asset }}
          path: dist/*

  windows:
    name: Cross-build (windows-x86_64)
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64 zip
      - uses: actions/download-artifact@v8
        with:
          name: gamma-linux-x86_64
          path: linux
      - name: Build gamma.exe with the Linux gamma
        run: |
          tar -C linux -xzf linux/gamma-linux-x86_64.tar.gz
          # gamma finds its library and runtime from its own location.
          linux/gamma-*/bin/gamma build --mode=fast compiler --target=x86_64-w64-mingw32 -o gamma.exe
      - name: Package
        run: tools/package-release.sh windows-x86_64 gamma.exe dist
      - uses: actions/upload-artifact@v7
        with:
          name: gamma-windows-x86_64
          path: dist/*

  windows-smoke:
    name: Smoke test (windows-x86_64)
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gamma-windows-x86_64
          path: dist
      - name: Install MinGW-w64 gcc (the C back end)
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Smoke test the installed layout
        shell: bash
        env:
          MSYS_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: |
          export PATH="$(cygpath "$MSYS_LOCATION")/ucrt64/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/smoke"
          7z x -y -bso0 -o"$RUNNER_TEMP/smoke" dist/gamma-windows-x86_64.zip
          # Hide the source tree's libraries and runtime, so that only the packaged ones
          # can be found.
          mv lib lib.hidden
          mv runtime runtime.hidden
          tools/smoke-release.sh "$(echo "$RUNNER_TEMP"/smoke/gamma-*/bin/gamma.exe)"

  publish:
    name: Publish the release
    needs: [build, windows, windows-smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To read the CI runs of the tagged commit, and to attest where the archives come from.
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
          if [ "${passed:-0}" -lt 1 ]; then
            echo "CI has not passed on $GITHUB_SHA: tag a commit of main whose CI run succeeded" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attest the provenance of the archives
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          # The release notes are the version's section of CHANGELOG.md.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Gamma $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS tools/install.sh tools/install.ps1
