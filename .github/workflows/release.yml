name: Release

# Pushing a tag `vX.Y.Z` builds the `gamma` binaries for Linux and macOS (x86_64 and
# arm64) and Windows (x86_64), checks that each one runs a program on the interpreter and
# through C from its installed layout, and publishes them as a GitHub release whose notes
# are the version's section of CHANGELOG.md. Running the workflow by hand builds and checks
# the archives without publishing them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Only the job that publishes the release writes to the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so that the binaries run on older glibc versions.
          - os: ubuntu-22.04
            asset: linux-x86_64
          - os: ubuntu-22.04-arm
            asset: linux-aarch64
          - os: macos-15-intel
            asset: macos-x86_64
          - os: macos-14
            asset: macos-aarch64
          - os: windows-latest
            asset: windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml" >&2
            exit 1
          fi
      - name: Check that CHANGELOG.md has a section for the crate version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if ! grep -q "^## $version\b" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Build
        # Windows builds link the C runtime statically, so gamma.exe needs no Visual C++
        # redistributable.
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          case "${{ matrix.asset }}" in
            windows-*) bin=target/release/gamma.exe ;;
            *) bin=target/release/gamma ;;
          esac
          tools/package-release.sh "${{ matrix.asset }}" "$bin" dist
      - name: Install MinGW-w64 gcc (the C back end of Windows builds)
        if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Smoke test the installed layout (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MSYS_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        run: |
          export PATH="$(cygpath "$MSYS_LOCATION")/ucrt64/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/smoke"
          7z x -y -bso0 -o"$RUNNER_TEMP/smoke" "dist/gamma-${{ matrix.asset }}.zip"
          gamma="$(echo "$RUNNER_TEMP"/smoke/gamma-*/bin/gamma.exe)"
          cat > "$RUNNER_TEMP/hello.gm" <<'EOF'
          str :: import "std/str"

          main :: fn() needs Out {
              print("{}\n", str.contains("gamma", "mm"))
          }
          EOF
          # Hide the source tree's library, so that only the packaged one can be found.
          mv lib/std lib/std.hidden
          cd "$RUNNER_TEMP"
          test "$("$gamma" run hello.gm | tr -d '\r')" = true
          test "$("$gamma" run --backend=c hello.gm | tr -d '\r')" = true
          "$gamma" version
      - name: Smoke test the installed layout
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -C "$RUNNER_TEMP/smoke" -xzf "dist/gamma-${{ matrix.asset }}.tar.gz"
          gamma="$(echo "$RUNNER_TEMP"/smoke/gamma-*/bin/gamma)"
          cat > "$RUNNER_TEMP/hello.gm" <<'EOF'
          str :: import "std/str"

          main :: fn() needs Out {
              print("{}\n", str.contains("gamma", "mm"))
          }
          EOF
          # Hide the source tree's library, so that only the packaged one can be found.
          mv lib/std lib/std.hidden
          cd "$RUNNER_TEMP"
          test "$("$gamma" run hello.gm)" = true
          test "$("$gamma" run --backend=c hello.gm)" = true
          "$gamma" version
      - uses: actions/upload-artifact@v7
        with:
          name: gamma-${{ matrix.asset }}
          path: dist/*

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To read the CI runs of the tagged commit, and to attest where the archives come from.
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
          if [ "${passed:-0}" -lt 1 ]; then
            echo "CI has not passed on $GITHUB_SHA: tag a commit of main whose CI run succeeded" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attest the provenance of the archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          # The release notes are the version's section of CHANGELOG.md.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Gamma $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS tools/install.sh tools/install.ps1
